name: Release tag

on:
  push:
    branches:
      - 'main'
    paths:
      - 'lean-toolchain'

jobs:
  lean-release-tag:
    name: Add Lean release tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: lean-release-tag action
      uses: leanprover-community/lean-release-tag@e3858bd52f5d8e45dc5a0166ae18334bf7d23c76 # v4.18804.0
      with:
        do-release: true
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A release created with `GITHUB_TOKEN` triggers no other workflow, so attach the olean
  # archives by calling the release workflow directly.
  oleans:
    name: Attach olean archives
    needs: lean-release-tag
    uses: ./.github/workflows/release-oleans.yml
    permissions:
      contents: write
